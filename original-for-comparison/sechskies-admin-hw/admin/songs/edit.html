<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>編輯歌曲｜水晶練習室 Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark sk-navbar">
    <div class="container-fluid">
      <span class="navbar-brand mb-0"><i class="bi bi-gem me-1"></i>水晶練習室 <span class="fw-light">Admin</span></span>
      <div class="d-flex gap-2">
        <a class="btn btn-brand btn-sm" href="../../index.html">回前台</a>
        <a class="btn btn-outline-brand btn-sm" href="../../index.html">登出</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <aside class="col-lg-2 border-end sk-admin-sidebar py-4 px-3 min-vh-100">
        <nav class="nav flex-column">
          <a class="nav-link" href="../index.html"><i class="bi bi-speedometer2 me-2"></i>後台首頁</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-people me-2"></i>練習生管理</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-mortarboard me-2"></i>課程管理</a>
          <a class="nav-link" href="../practices/index.html"><i class="bi bi-journal-text me-2"></i>練習紀錄管理</a>
          <a class="nav-link active" href="index.html"><i class="bi bi-music-note-list me-2"></i>歌曲資料管理</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-list-task me-2"></i>訓練任務管理</a>
        </nav>
      </aside>

      <main class="col-lg-10 py-4 px-4">
        <h1 class="h3 mb-4 text-white">編輯歌曲</h1>

        <div class="card sk-card sk-surface p-4">
          <form>
            <div class="row g-3">

              <div class="col-md-6">
                <label for="songId" class="form-label">編號</label>
                <input type="text" class="form-control" id="songId" value="1" disabled>
              </div>

              <div class="col-md-6"></div>

              <div class="col-md-6">
                <label for="songName" class="form-label">歌名</label>
                <input type="text" class="form-control" id="songName" value="Couple">
              </div>

              <div class="col-md-6">
                <label for="songAlbum" class="form-label">專輯</label>
                <input type="text" class="form-control" id="songAlbum" value="Come Back Again">
              </div>

              <div class="col-md-6">
                <label for="songYear" class="form-label">發行年份</label>
                <input type="number" class="form-control" id="songYear" value="1997">
              </div>

              <div class="col-md-6">
                <label for="songYoutube" class="form-label">YouTube 連結</label>
                <input type="url" class="form-control" id="songYoutube" value="https://www.youtube.com/">
              </div>

              <div class="col-md-6">
                <label for="songDifficulty" class="form-label">舞蹈難度</label>
                <select class="form-select" id="songDifficulty">
                  <option>低</option>
                  <option selected>中等</option>
                  <option>高</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label d-block">是否顯示</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" role="switch" id="songVisible" checked>
                  <label class="form-check-label" for="songVisible">於前台顯示</label>
                </div>
              </div>

            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-brand">儲存變更</button>
              <a class="btn btn-outline-brand" href="index.html">取消</a>
            </div>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
