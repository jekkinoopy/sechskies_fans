<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>後台首頁｜水晶練習室 Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <!-- 後台上方 Navbar -->
  <nav class="navbar navbar-expand navbar-dark sk-navbar">
    <div class="container-fluid">
      <span class="navbar-brand mb-0"><i class="bi bi-gem me-1"></i>水晶練習室 <span class="fw-light">Admin</span></span>
      <div class="d-flex gap-2">
        <a class="btn btn-brand btn-sm" href="../index.html">回前台</a>
        <a class="btn btn-outline-brand btn-sm" href="../index.html">登出</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <!-- 左側管理選單 -->
      <aside class="col-lg-2 border-end sk-admin-sidebar py-4 px-3 min-vh-100">
        <nav class="nav flex-column">
          <a class="nav-link active" href="index.html"><i class="bi bi-speedometer2 me-2"></i>後台首頁</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-people me-2"></i>練習生管理</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-mortarboard me-2"></i>課程管理</a>
          <a class="nav-link" href="practices/index.html"><i class="bi bi-journal-text me-2"></i>練習紀錄管理</a>
          <a class="nav-link" href="songs/index.html"><i class="bi bi-music-note-list me-2"></i>歌曲資料管理</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-list-task me-2"></i>訓練任務管理</a>
        </nav>
      </aside>

      <!-- 主內容 -->
      <main class="col-lg-10 py-4 px-4">
        <h1 class="h3 mb-4 text-white">後台首頁</h1>

        <div class="row g-4 mb-5">
          <div class="col-sm-6 col-xl-3">
            <div class="card sk-card shadow-sm h-100 p-3">
              <div class="card-body">
                <i class="bi bi-people fs-3 text-white"></i>
                <div class="text-body-secondary small mt-2 mb-1">練習生人數</div>
                <div class="sk-stat-value">6</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card sk-card shadow-sm h-100 p-3">
              <div class="card-body">
                <i class="bi bi-lightning-charge fs-3 text-white"></i>
                <div class="text-body-secondary small mt-2 mb-1">今日練習次數</div>
                <div class="sk-stat-value">9</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card sk-card shadow-sm h-100 p-3">
              <div class="card-body">
                <i class="bi bi-mortarboard fs-3 text-white"></i>
                <div class="text-body-secondary small mt-2 mb-1">課程數量</div>
                <div class="sk-stat-value">8</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card sk-card shadow-sm h-100 p-3">
              <div class="card-body">
                <i class="bi bi-check2-circle fs-3 text-white"></i>
                <div class="text-body-secondary small mt-2 mb-1">已完成任務數</div>
                <div class="sk-stat-value">23</div>
              </div>
            </div>
          </div>
        </div>

        <h2 class="sk-section-title"><i class="bi bi-journal-text"></i>最近練習紀錄</h2>

        <div class="card sk-card sk-surface">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>練習生</th>
                  <th>日期</th>
                  <th>訓練類型</th>
                  <th>歌曲</th>
                  <th>練習時間</th>
                  <th>完成度</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>努比</td>
                  <td>2026-07-16</td>
                  <td><span class="badge badge-type badge-type--dance">舞蹈</span></td>
                  <td>Road Fighter</td>
                  <td>40 分鐘</td>
                  <td>85%</td>
                </tr>
                <tr>
                  <td>昇材</td>
                  <td>2026-07-16</td>
                  <td><span class="badge badge-type badge-type--vocal">vocal</span></td>
                  <td>Couple</td>
                  <td>35 分鐘</td>
                  <td>78%</td>
                </tr>
                <tr>
                  <td>水院</td>
                  <td>2026-07-15</td>
                  <td><span class="badge badge-type badge-type--rap">Rap</span></td>
                  <td>Chivalry</td>
                  <td>25 分鐘</td>
                  <td>60%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
