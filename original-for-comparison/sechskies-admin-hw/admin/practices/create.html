<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增練習紀錄｜水晶練習室 Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark sk-navbar">
    <div class="container-fluid">
      <span class="navbar-brand mb-0"><i class="bi bi-gem me-1"></i>水晶練習室 <span class="fw-light">Admin</span></span>
      <div class="d-flex gap-2">
        <a class="btn btn-brand btn-sm" href="../../index.html">回前台</a>
        <a class="btn btn-outline-brand btn-sm" href="../../index.html">登出</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <aside class="col-lg-2 border-end sk-admin-sidebar py-4 px-3 min-vh-100">
        <nav class="nav flex-column">
          <a class="nav-link" href="../index.html"><i class="bi bi-speedometer2 me-2"></i>後台首頁</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-people me-2"></i>練習生管理</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-mortarboard me-2"></i>課程管理</a>
          <a class="nav-link active" href="index.html"><i class="bi bi-journal-text me-2"></i>練習紀錄管理</a>
          <a class="nav-link" href="../songs/index.html"><i class="bi bi-music-note-list me-2"></i>歌曲資料管理</a>
          <a class="nav-link disabled" href="#" aria-disabled="true"><i class="bi bi-list-task me-2"></i>訓練任務管理</a>
        </nav>
      </aside>

      <main class="col-lg-10 py-4 px-4">
        <h1 class="h3 mb-4 text-white">新增練習紀錄</h1>

        <div class="card sk-card sk-surface p-4" style="max-width: 42rem;">
          <form>
            <div class="row g-3">

              <div class="col-md-6">
                <label for="traineeName" class="form-label">練習生</label>
                <select class="form-select" id="traineeName">
                  <option>努比</option>
                  <option>昇材</option>
                  <option>宰鎮</option>
                  <option>水院</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="practiceDate" class="form-label">日期</label>
                <input type="date" class="form-control" id="practiceDate">
              </div>

              <div class="col-md-6">
                <label for="practiceType" class="form-label">訓練類型</label>
                <select class="form-select" id="practiceType">
                  <option>vocal</option>
                  <option>舞蹈</option>
                  <option>Rap</option>
                  <option>舞台表現</option>
                  <option>體能</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="practiceSong" class="form-label">歌曲</label>
                <select class="form-select" id="practiceSong">
                  <option>Couple</option>
                  <option>Road Fighter</option>
                  <option>Com' Back</option>
                  <option>Chivalry</option>
                  <option>The Way This Guy Lives</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="practiceMinutes" class="form-label">練習時間（分鐘）</label>
                <input type="number" class="form-control" id="practiceMinutes" placeholder="例如：40">
              </div>

              <div class="col-md-6">
                <label for="practiceStatus" class="form-label">完成狀態</label>
                <select class="form-select" id="practiceStatus">
                  <option>未開始</option>
                  <option>進行中</option>
                  <option>已完成</option>
                </select>
              </div>

              <div class="col-12">
                <label for="practiceCompletion" class="form-label d-flex justify-content-between">
                  <span>完成度</span>
                  <span class="text-body-secondary" id="completionValue">50%</span>
                </label>
                <input type="range" class="form-range" id="practiceCompletion" min="0" max="100" value="50"
                       oninput="document.getElementById('completionValue').textContent = this.value + '%'">
              </div>

            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-brand">儲存</button>
              <a class="btn btn-outline-brand" href="index.html">取消</a>
            </div>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
