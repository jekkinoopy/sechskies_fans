<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>練習紀錄詳情｜水晶練習室</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sk-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="bi bi-gem me-1"></i>水晶練習室</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="../index.html">練習室首頁</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html#today">今日訓練</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">我的練習紀錄</a></li>
          <li class="nav-item"><a class="nav-link disabled" href="#" aria-disabled="true">課程庫</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html#progress">個人進度</a></li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-brand btn-sm" href="../admin/index.html">後台管理</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="h3 mb-4 text-white"><i class="bi bi-journal-check me-2"></i>練習紀錄詳情</h1>

    <div class="card sk-card sk-surface p-4" style="max-width: 42rem;">

      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="badge badge-type badge-type--dance">舞蹈</span>
        <span class="badge badge-status badge-status--done">已完成</span>
      </div>

      <dl class="row mb-0">
        <dt class="col-4 text-body-secondary">練習日期</dt>
        <dd class="col-8">2026-07-16</dd>

        <dt class="col-4 text-body-secondary">訓練類型</dt>
        <dd class="col-8">舞蹈</dd>

        <dt class="col-4 text-body-secondary">練習歌曲</dt>
        <dd class="col-8">Road Fighter</dd>

        <dt class="col-4 text-body-secondary">練習時間</dt>
        <dd class="col-8">40 分鐘</dd>

        <dt class="col-4 text-body-secondary">完成度</dt>
        <dd class="col-8">
          <div class="progress sk-progress" style="max-width: 12rem;">
            <div class="progress-bar" style="width: 85%" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </dd>

        <dt class="col-4 text-body-secondary">練習心得</dt>
        <dd class="col-8">隊形轉換卡點抓得比昨天準，副歌動作幅度還要再放大。</dd>
      </dl>

      <div class="d-flex gap-2 mt-4">
        <a class="btn btn-brand" href="edit.html">編輯這筆紀錄</a>
        <a class="btn btn-outline-brand" href="index.html">回練習紀錄列表</a>
      </div>
    </div>
  </main>

  <footer class="sk-footer text-center py-4">
    <small>&copy; 2026 水晶練習室</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
